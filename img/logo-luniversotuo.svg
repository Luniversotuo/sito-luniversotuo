<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 52" width="260" height="52">
  <defs>
    <clipPath id="circleClip">
      <circle cx="26" cy="26" r="23"/>
    </clipPath>
  </defs>

  <!-- Outer white ring -->
  <circle cx="26" cy="26" r="25.5" fill="white"/>
  <!-- Blue circle fill -->
  <circle cx="26" cy="26" r="23" fill="#1a5196"/>

  <!-- Cape swoosh (white diagonal arc behind body) -->
  <path d="M 10 22 Q 26 10 42 20 L 40 28 Q 26 16 12 26 Z" fill="white" clip-path="url(#circleClip)"/>

  <!-- Superhero body silhouette -->
  <!-- Head -->
  <circle cx="26" cy="13" r="4.8" fill="white" clip-path="url(#circleClip)"/>
  <!-- Torso + shoulders -->
  <path d="M 15 28 C 15 22 20 19 26 19 C 32 19 37 22 37 28 L 37 36 L 15 36 Z" fill="white" clip-path="url(#circleClip)"/>
  <!-- Left arm on hip -->
  <path d="M 15 28 L 9 30 L 10 35 L 16 33 L 15 28" fill="white" clip-path="url(#circleClip)"/>
  <!-- Right arm on hip -->
  <path d="M 37 28 L 43 30 L 42 35 L 36 33 L 37 28" fill="white" clip-path="url(#circleClip)"/>
  <!-- Legs -->
  <path d="M 17 36 L 22 46 L 26 44 L 30 46 L 35 36 Z" fill="white" clip-path="url(#circleClip)"/>

  <!-- Blue name banner -->
  <rect x="56" y="4" width="198" height="28" rx="3" fill="#1a5196"/>
  <rect x="54" y="2" width="202" height="32" rx="4" fill="none" stroke="white" stroke-width="2"/>
  <text x="155" y="22" font-family="Impact, Arial Black, 'Franklin Gothic Medium', sans-serif" font-size="19" font-weight="900" fill="white" text-anchor="middle" letter-spacing="2.5" dominant-baseline="middle">LUNIVERSOTUO</text>

  <!-- Tagline below -->
  <text x="155" y="41" font-family="Arial, Helvetica, sans-serif" font-size="7.5" font-weight="600" fill="rgba(255,255,255,0.55)" text-anchor="middle" letter-spacing="1.2">L'UNICO CHE ASSICURA LA SUPERSERENITÀ®</text>
</svg>
